name: Generate Stubs
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.3', '8.4']
    
    name: PHP ${{ matrix.php-version }}
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
    
    - name: Validate composer.json
      run: composer validate --strict
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Install source dependencies
      run: cd source && composer install --prefer-dist --no-progress
    
    - name: Generate stubs
      run: bash generate.sh
    
    - name: Check if stubs file exists
      run: test -f contact-form-7-stubs.php
    
    - name: Upload stubs artifact
      uses: actions/upload-artifact@v7
      with:
        name: contact-form-7-stubs-php-${{ matrix.php-version }}
        path: contact-form-7-stubs.php

  update-script:
    runs-on: ubuntu-latest
    name: Tests of scripts/update-source.sh

    steps:
    - uses: actions/checkout@v7

    - name: Run the tests
      run: bash tests/update-source.sh
